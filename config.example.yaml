app:
  title: Joi

llm:
  provider: openai_compatible
  use_mock: true
  # --- text model (default, used for chat and fallback) ---
  base_url: https://api.openai.com/v1
  model: gpt-4.1-mini
  api_key: ${JOI_LLM_API_KEY}
  temperature: 0.7
  mock_when_unconfigured: true
  # --- vision model (optional, for screen observation summarizer) ---
  vision_enabled: false
  vision_base_url: ""
  vision_model: ""
  vision_api_key: ${JOI_VISION_API_KEY}
  # --- expression model (optional, for character voice rewriting) ---
  expression_enabled: false
  expression_base_url: ""
  expression_model: ""
  expression_api_key: ${JOI_EXPRESSION_API_KEY}

tts:
  enabled: false
  provider: gpt-sovits
  server_url: http://127.0.0.1:9880/
  gpt_sovits_work_path: ""
  # Which Python runs GPT-SoVITS. Leave empty on Windows, whose bundle ships
  # its own; on macOS and Linux, leave empty if the install has a virtualenv
  # inside it (.venv/, venv/, runtime/), and otherwise point at the
  # interpreter of the environment you installed GPT-SoVITS into. Joi's own
  # Python cannot run it. Leaving this unset is also fine if you start
  # api_v2.py yourself -- Joi uses a server that is already running.
  gpt_sovits_python: ""
  # Official api_v2 streaming mode: 2 balances quality and first-audio speed;
  # 3 is faster but lower quality and should be chosen only after listening.
  gpt_sovits_streaming_mode: 2
  # Fix the seed and narrow sampling only after intelligibility testing for
  # the installed voice. -1 preserves the provider's random default.
  gpt_sovits_seed: -1
  gpt_sovits_top_k: 15
  gpt_sovits_top_p: 1.0
  gpt_sovits_temperature: 1.0
  gpt_sovits_repetition_penalty: 1.35
  text_lang: zh
  prompt_lang: zh
  speed_factor: 1.2
  # A hosted /v1/audio/speech endpoint, used when provider is
  # `openai_compatible`. This is the quick way to exercise the whole voice
  # path -- barge-in, lip sync, emotion -- before installing GPT-SoVITS, but
  # it sends every spoken line to that provider. Put api_key in secrets.yaml
  # rather than here. Works with OpenAI, 硅基流动, Fish Audio and most proxies.
  base_url: ""
  api_key: ""
  model: ""
  voice: ""
  audio_format: wav
  timeout_seconds: 60

asr:
  enabled: false
  provider: openai_compatible
  base_url: https://api.openai.com/v1
  model: whisper-1
  api_key: ${JOI_ASR_API_KEY}
  language: zh
  max_seconds: 30
  max_bytes: 12582912
  timeout_seconds: 30

# Qwen Audio Realtime input. Shell sends bounded PCM16 frames only; Core owns
# provider authentication and accepts text output only. Joi keeps speaking via
# the configured local GPT-SoVITS voice. Minecraft tools are proposals routed
# through the ordinary scoped permission/budget/receipt gate.
realtime_voice:
  enabled: false
  provider: qwen_audio
  url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
  model: qwen-audio-3.0-realtime-flash
  api_key: ${JOI_QWEN_REALTIME_API_KEY}
  turn_detection: server_vad
  threshold: 0.5
  silence_duration_ms: 500
  max_history_turns: 8
  timeout_seconds: 15

ocr:
  timeout_seconds: 5
  language: chi_sim+eng+jpn
  # Optional absolute path when Tesseract is installed outside PATH.
  tesseract_cmd: ""
  # Optional absolute path for local traineddata files.
  tessdata_dir: ""

computer_use:
  # Wait briefly before the post-action screenshot so Windows/UI updates can settle.
  post_action_settle_ms: 200

language:
  # The shell's own language. Only Chinese is translated, so this stays "zh".
  interface: zh
  # What Joi writes on screen: zh, en, ja, ko, or "follow" to take the language
  # of each message. What she *says* is the character package's voice language
  # and is chosen with the voice, not here.
  chat: zh

characters:
  - name: Joi
    color: "#d76f8f"
    sprite_color: "#224e66"
    setting: |
      Joi 是这个应用的默认角色。她熟悉代码、游戏和屏幕内容，会用简短自然的方式说明计划、提醒风险和汇报结果。
      她不会朗读 JSON、路径、命令、token、日志或工具 id。
    active_voice_profile: zh
    prompt_lang: zh
    speech_speed: 1.2
    speech_volume: 1.0
    voice_profiles:
      - id: zh
        label: 中文
        text_lang: zh
        prompt_lang: zh
        gpt_model_path: ""
        sovits_model_path: ""
        refer_audio_path: ""
        prompt_text: ""
