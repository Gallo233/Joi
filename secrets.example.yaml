llm:
  api_key: your-provider-api-key

# Only needed when tts.provider is `openai_compatible`. Merged over
# config.yaml at load, so the key stays out of the file you might share.
tts:
  api_key: your-tts-api-key

# Optional click-to-record transcription provider.
asr:
  api_key: your-asr-api-key

# Optional Qwen Audio Realtime key. Production debug builds import this into
# the macOS Keychain instead of keeping it in this file.
realtime_voice:
  api_key: your-realtime-api-key
