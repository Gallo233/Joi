name: Joi CI

on:
  push:
    branches:
      - main
      - win-desktop-fixes
  pull_request:

jobs:
  python-core:
    name: Python core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run core regression suite
        run: python run_agent_companion_tests.py

  shell-and-packaging:
    name: Shell build and packaging smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent_companion/shell/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: agent_companion/shell
        run: npm ci
      - name: Run packaging metadata smoke
        run: python tools/packaging_smoke.py
      - name: Build frontend
        working-directory: agent_companion/shell
        run: npm run build
      - name: Tauri debug smoke build
        working-directory: agent_companion/shell
        run: npm run tauri -- build --debug --no-bundle
