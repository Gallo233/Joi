name: Joi CI

# macOS is the required lane: Joi 1.0 ships macOS-first, so a green Windows run
# is never sufficient evidence for the primary platform. Windows remains a
# compatibility lane for the shared RPC/event/schema surface and its adapters.
# See docs/JOI_TDD.md §15.2.

on:
  push:
    branches:
      - main
      - win-desktop-fixes
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  macos-required:
    name: macOS required lane
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_companion/shell/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-ocr.txt carries Pillow, which `vision/mac.py` imports at
          # module scope. Without it the macOS capture tests do not fail -- they
          # never run, because the module they import cannot load.
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-macos.txt -r requirements-ocr.txt
      - name: Install frontend dependencies
        working-directory: agent_companion/shell
        run: npm ci
      - name: Build the reviewed Minecraft bridge bundle
        # Before the Python tests, not after: the bridge contract tests drive
        # the built bundle, and an unbuilt one reports `minecraft_bridge_not_found`
        # rather than testing anything.
        working-directory: agent_companion/adapters/minecraft-bridge
        run: |
          node --check index.js
          npm ci
          npm run build
      - name: Run unit, contract, migration and recovery tests
        run: python -m unittest discover -s tests -v
      - name: Run core regression suite
        run: python run_agent_companion_tests.py
      - name: Run shell tests
        working-directory: agent_companion/shell
        run: npm run test:shell
      - name: Typecheck and build shell
        working-directory: agent_companion/shell
        run: npm run build
      - name: Build standalone Core sidecar
        # Before `cargo check`, not after: `tauri.conf.json` declares
        # `binaries/joi-core-runtime/` as a bundle resource, and Tauri's build
        # script validates resource paths on a plain check too -- an unbuilt
        # sidecar fails the compile rather than the packaging step.
        working-directory: agent_companion/shell
        run: npm run core:bundle
      - name: Check Tauri shell
        working-directory: agent_companion/shell/src-tauri
        run: cargo check
      - name: Smoke-test sidecar ready handshake and auth
        run: python tools/smoke_core_sidecar.py
      - name: Run packaging and release privacy scan
        run: python tools/packaging_smoke.py
      - name: Run the offline Minecraft bridge smoke
        # Against the built bundle, which is what a release actually ships:
        # `node --check` alone proved only that the source parses.
        run: python tools/minecraft_p5_smoke.py

  windows-compatibility:
    name: Windows compatibility lane
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_companion/shell/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install frontend dependencies
        working-directory: agent_companion/shell
        run: npm ci
      - name: Run shared contract and core regression suite
        run: |
          python -m unittest discover -s tests -v
          python run_agent_companion_tests.py
      - name: Run packaging metadata smoke
        run: python tools/packaging_smoke.py
      - name: Run setup wizard dry-run
        run: python tools/windows_setup_wizard.py
      - name: Run provider preflight
        run: python tools/provider_preflight.py
      - name: Run MVP demo check
        run: python tools/mvp_demo_check.py
      - name: Run release packager dry-run
        run: python tools/package_windows_release.py --dry-run --allow-missing-exe
      - name: Run release readiness check
        run: python tools/windows_release_check.py --skip-doctor --allow-missing-exe
      - name: Run Windows handoff report
        run: python tools/windows_handoff_report.py --skip-doctor --allow-missing-exe
      - name: Run shell tests
        working-directory: agent_companion/shell
        run: npm run test:shell
      - name: Build frontend
        working-directory: agent_companion/shell
        run: npm run build
      - name: Build standalone Core sidecar
        working-directory: agent_companion/shell
        run: npm run core:bundle
      - name: Smoke-test standalone Core sidecar
        run: python tools/smoke_core_sidecar.py
      - name: Check Tauri shell
        working-directory: agent_companion/shell/src-tauri
        run: cargo check
