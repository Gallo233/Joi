name: Joi Windows Release Candidate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows-release-candidate:
    name: Windows release build and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent_companion/shell/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: agent_companion/shell
        run: npm ci
      - name: Run regression suite
        run: python run_agent_companion_tests.py
      - name: Build Tauri release
        working-directory: agent_companion/shell
        run: npm run tauri -- build
      - name: Package Windows portable zip
        run: python tools/package_windows_release.py --output-dir dist
      - name: Run release readiness check
        run: python tools/windows_release_check.py --skip-doctor
      - name: Run Windows handoff report
        run: python tools/windows_handoff_report.py --skip-doctor
      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: joi-windows-release-candidate
          path: dist/*.zip
          if-no-files-found: error
