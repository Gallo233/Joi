name: Joi Windows Release Candidate

on:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  JOI_RELEASE_ASSETS_URL: ${{ secrets.JOI_RELEASE_ASSETS_URL }}
  JOI_RELEASE_ASSETS_SHA256: ${{ secrets.JOI_RELEASE_ASSETS_SHA256 }}

jobs:
  windows-release-candidate:
    name: Windows release build and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent_companion/shell/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # The OCR wrapper ships so that installing Tesseract is all a user
          # needs; the executable itself stays a system dependency pip cannot
          # supply, and OCR reports itself unavailable until it is there.
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-ocr.txt
      - name: Provision pinned release assets
        shell: pwsh
        run: |
          if (-not $env:JOI_RELEASE_ASSETS_URL -or -not $env:JOI_RELEASE_ASSETS_SHA256) {
            throw "JOI_RELEASE_ASSETS_URL and JOI_RELEASE_ASSETS_SHA256 repository secrets are required."
          }
          $archive = Join-Path $env:RUNNER_TEMP "joi-release-assets.zip"
          $destination = Join-Path $env:RUNNER_TEMP "joi-release-assets"
          Invoke-WebRequest -Uri $env:JOI_RELEASE_ASSETS_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:JOI_RELEASE_ASSETS_SHA256.ToLowerInvariant()) {
            throw "Release asset archive SHA-256 does not match."
          }
          Expand-Archive -Path $archive -DestinationPath $destination
          $public = Join-Path $destination "public"
          if (-not (Test-Path $public -PathType Container)) { throw "Release asset archive must contain public/." }
          "JOI_LIVE2D_SOURCE=$public" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install frontend dependencies
        working-directory: agent_companion/shell
        run: npm ci
      - name: Run regression suite
        run: python run_agent_companion_tests.py
      - name: Build Tauri release
        working-directory: agent_companion/shell
        run: npm run tauri -- build
      - name: Smoke-test standalone Core sidecar
        run: python tools/smoke_core_sidecar.py
      - name: Package Windows portable zip
        run: python tools/package_windows_release.py --output-dir dist
      - name: Run release readiness check
        run: python tools/windows_release_check.py --skip-doctor
      - name: Run Windows handoff report
        run: python tools/windows_handoff_report.py --skip-doctor
      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: joi-windows-release-candidate
          path: dist/*.zip
          if-no-files-found: error
