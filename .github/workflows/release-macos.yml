name: Joi macOS Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos-arm64:
    name: Build signed Apple Silicon release
    runs-on: macos-15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      JOI_RELEASE_ASSETS_URL: ${{ secrets.JOI_RELEASE_ASSETS_URL }}
      JOI_RELEASE_ASSETS_SHA256: ${{ secrets.JOI_RELEASE_ASSETS_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent_companion/shell/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Require signing, notarization, and licensed asset secrets
        shell: bash
        run: |
          required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID JOI_RELEASE_ASSETS_URL JOI_RELEASE_ASSETS_SHA256)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Provision pinned release assets
        shell: bash
        run: |
          curl --fail --location --silent --show-error "$JOI_RELEASE_ASSETS_URL" --output "$RUNNER_TEMP/joi-release-assets.zip"
          echo "$JOI_RELEASE_ASSETS_SHA256  $RUNNER_TEMP/joi-release-assets.zip" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/joi-release-assets"
          ditto -x -k "$RUNNER_TEMP/joi-release-assets.zip" "$RUNNER_TEMP/joi-release-assets"
          test -d "$RUNNER_TEMP/joi-release-assets/public"
          echo "JOI_LIVE2D_SOURCE=$RUNNER_TEMP/joi-release-assets/public" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          npm ci --prefix agent_companion/shell

      - name: Run release gates
        run: |
          python run_agent_companion_tests.py
          python tools/packaging_smoke.py
          npm run live2d:sync --prefix agent_companion/shell
          npm run assets:verify --prefix agent_companion/shell
          npm run core:bundle --prefix agent_companion/shell
          python tools/smoke_core_sidecar.py

      - name: Build, sign, notarize, and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agent_companion/shell
          tagName: v__VERSION__
          releaseName: Joi v__VERSION__
          releaseBody: Apple Silicon MVP candidate. Install only after the clean-machine checklist has passed.
          releaseDraft: true
          prerelease: true
          args: --target aarch64-apple-darwin

      - name: Attest macOS release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: agent_companion/shell/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
