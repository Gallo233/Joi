<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joi Floating Assistant Demo</title>
    <style>
      :root {
        color: #26343b;
        background: #f6f0ea;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 250, 246, 0.96), rgba(239, 231, 222, 0.92)),
          #f6f0ea;
      }

      main {
        width: min(960px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 64px 0 120px;
      }

      .demo-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 24px;
        align-items: start;
      }

      section,
      aside {
        border: 1px solid rgba(69, 47, 41, 0.14);
        border-radius: 8px;
        background: rgba(255, 250, 246, 0.78);
        box-shadow: 0 18px 44px rgba(69, 47, 41, 0.1);
      }

      section { padding: 32px; }
      aside { padding: 18px; }

      h1 {
        margin: 0 0 10px;
        max-width: 660px;
        font-size: clamp(32px, 5vw, 58px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #5f696a;
        line-height: 1.7;
      }

      .rows {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 0;
        border-top: 1px solid rgba(69, 47, 41, 0.1);
      }

      .row strong { color: #26343b; }
      .row span { color: #607278; text-align: right; }

      img {
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(69, 47, 41, 0.12);
        background: white;
      }

      code {
        display: block;
        margin-top: 16px;
        padding: 14px;
        overflow: auto;
        border-radius: 8px;
        background: #26343b;
        color: #fffaf6;
        font-size: 12px;
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        main { padding-top: 28px; }
        .demo-shell { grid-template-columns: 1fr; }
        section { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="demo-shell">
        <section>
          <h1>Joi</h1>
          <p>悬浮在个人网站里的互动 AI 助手，支持鼠标注视、头部跟随、拖拽摆动和 Joi Core WebSocket 对话。</p>
          <div class="rows">
            <div class="row"><strong>交互</strong><span>看向鼠标、拖拽、点击气泡聊天</span></div>
            <div class="row"><strong>协议</strong><span>JSON-RPC over WebSocket</span></div>
            <div class="row"><strong>默认 Core</strong><span>ws://127.0.0.1:8765</span></div>
          </div>
          <code>&lt;script src="/joi-floating-assistant.js" defer&gt;&lt;/script&gt;
&lt;joi-floating-assistant core-url="ws://127.0.0.1:8765"&gt;&lt;/joi-floating-assistant&gt;</code>
        </section>
        <aside>
          <img src="./assets/joi-reference-small.png" alt="Joi 设定图缩略图" />
        </aside>
      </div>
    </main>

    <script src="./joi-floating-assistant.js" defer></script>
    <joi-floating-assistant core-url="ws://127.0.0.1:8765"></joi-floating-assistant>
  </body>
</html>
